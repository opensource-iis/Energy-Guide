function show(id) {
  const scene = GUIDE.scenes[id];
  document.getElementById("text").textContent = scene.text.trim();
  const list = document.getElementById("options");
  list.innerHTML = "";
  scene.options.forEach(function (opt) {
    const li = document.createElement("li");
    const button = document.createElement("button");
    button.textContent = opt.label;
    button.onclick = function () { show(opt.goto); };
    li.append(button);
    list.append(li);
    const img = document.getElementById("scene-image");
  if (scene.image) {
    img.src = scene.image;
    img.alt = scene.imageAlt || "";
    img.hidden = false;
  } else {
    img.hidden = true;
  }
  });
}
